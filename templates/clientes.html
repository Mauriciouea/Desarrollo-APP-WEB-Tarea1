{% extends "base.html" %}

{% block content %}
<h1>Clientes</h1>
<h3>Listado de clientes.</h3>

<div class="d-flex justify-content-end mb-3">
    <a href="{{ url_for('cliente_form.nuevo_cliente') }}" class="btn btn-success">
        <i class="bi bi-plus-circle me-2"></i> Nuevo cliente
    </a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>email</th>
            <th>Telefono</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.telefono }}</td>
            <td>
                <a href="{{ url_for('cliente_form.editar_cliente', nombre=cliente.nombre) }}" class="btn btn-primary">Editar</a>
                <form action="{{ url_for('eliminar_cliente', nombre=cliente.nombre) }}" method="POST" style="display: inline;">
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<p>Total de Registros: {{ clientes|length }}</p>
{% endblock %}
