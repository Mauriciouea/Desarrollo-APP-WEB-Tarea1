{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="text-center mb-4">
        <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill mb-2">
            <i class="bi bi-{{ 'pencil' if proveedor else 'plus-circle' }} me-1"></i>
            {{ 'Editar registro' if proveedor else 'Nuevo registro' }}
        </span>
        <h2 class="fw-bold display-6">{{ 'Editar Proveedor' if proveedor else 'Ingresar Proveedor' }}</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card info-card">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('proveedor_form.editar_proveedor', nombre=proveedor.nombre) if proveedor else url_for('proveedor_form.nuevo_proveedor') }}">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre del proveedor</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                   value="{{ proveedor.nombre if proveedor else '' }}"
                                   placeholder="Ej: TechSupply Cía. Ltda." required>
                        </div>

                        <div class="mb-3">
                            <label for="producto" class="form-label fw-semibold">Producto / Servicio que provee</label>
                            <input type="text" class="form-control" id="producto" name="producto"
                                   value="{{ proveedor.producto if proveedor else '' }}"
                                   placeholder="Ej: Equipos informáticos" required>
                        </div>

                        <div class="mb-3">
                            <label for="contacto" class="form-label fw-semibold">Correo de contacto</label>
                            <input type="email" class="form-control" id="contacto" name="contacto"
                                   value="{{ proveedor.contacto if proveedor else '' }}"
                                   placeholder="ejemplo@empresa.com" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="bi bi-check-circle me-2"></i> {{ 'Guardar cambios' if proveedor else 'Guardar proveedor' }}
                            </button>
                            <a href="{{ url_for('proveedor_form.proveedores') }}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
