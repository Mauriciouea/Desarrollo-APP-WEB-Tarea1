{% extends "base.html" %}

{% block title %}Nuevo Producto - Sistema de Administración{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="text-center mb-4">
        <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill mb-2">
            <i class="bi bi-plus-circle me-1"></i> Nuevo registro
        </span>
        <h2 class="fw-bold display-6">Ingresar Producto</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card info-card">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('producto_form.nuevo_producto') }}">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre del producto</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                   placeholder="Ej: Consultoría TI" required>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-semibold">Categoría</label>
                            <select class="form-select" id="categoria" name="categoria" required>
                                <option value="">Selecciona una categoría...</option>
                                <option value="Desarrollo">💻 Desarrollo</option>
                                <option value="Diseño">🎨 Diseño</option>
                                <option value="Infraestructura">🏗️ Infraestructura</option>
                                <option value="Seguridad">🔒 Seguridad</option>
                                <option value="Consultoría">📊 Consultoría</option>
                                <option value="Otro">🔹 Otro</option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="precio" class="form-label fw-semibold">Precio ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       id="precio" name="precio" placeholder="0.00" required>
                            </div>
                            <div class="col-6">
                                <label for="stock" class="form-label fw-semibold">Stock</label>
                                <input type="number" min="0" class="form-control"
                                       id="stock" name="stock" placeholder="0" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="bi bi-check-circle me-2"></i> Guardar producto
                            </button>
                            <a href="{{ url_for('producto_form.productos') }}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
