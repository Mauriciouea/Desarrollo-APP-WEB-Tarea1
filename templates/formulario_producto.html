{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>{% if producto %}Editar{% else %}Nuevo{% endif %} Producto</h1>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ producto.nombre if producto else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Categoría:</label>
            <input type="text" name="categoria" class="form-control"
                   value="{{ producto.categoria if producto else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Precio:</label>
            <input type="number" step="0.01" name="precio" class="form-control"
                   value="{{ producto.precio if producto else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Stock:</label>
            <input type="number" name="stock" class="form-control"
                   value="{{ producto.stock if producto else '' }}">
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('producto_form.productos') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
