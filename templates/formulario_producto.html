{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="text-center mb-4">
        <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill mb-2">
            <i class="bi bi-{{ 'pencil' if producto else 'plus-circle' }} me-1"></i>
            {{ 'Editar registro' if producto else 'Nuevo registro' }}
        </span>
        <h2 class="fw-bold display-6">{{ 'Editar Producto' if producto else 'Ingresar Producto' }}</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card info-card">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('producto_form.editar_producto', nombre=producto.nombre) if producto else url_for('producto_form.nuevo_producto') }}">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre del producto</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                   value="{{ producto.nombre if producto else '' }}"
                                   placeholder="Ej: Consultoría TI" required>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-semibold">Categoría</label>
                            <select class="form-select" id="categoria" name="categoria" required>
                                <option value="">Selecciona una categoría...</option>
                                <option value="Desarrollo" {{ 'selected' if producto and producto.categoria == 'Desarrollo' else '' }}>💻 Desarrollo</option>
                                <option value="Diseño" {{ 'selected' if producto and producto.categoria == 'Diseño' else '' }}>🎨 Diseño</option>
                                <option value="Infraestructura" {{ 'selected' if producto and producto.categoria == 'Infraestructura' else '' }}>🏗️ Infraestructura</option>
                                <option value="Seguridad" {{ 'selected' if producto and producto.categoria == 'Seguridad' else '' }}>🔒 Seguridad</option>
                                <option value="Consultoría" {{ 'selected' if producto and producto.categoria == 'Consultoría' else '' }}>📊 Consultoría</option>
                                <option value="Otro" {{ 'selected' if producto and producto.categoria == 'Otro' else '' }}>🔹 Otro</option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="precio" class="form-label fw-semibold">Precio ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       id="precio" name="precio"
                                       value="{{ producto.precio if producto else '' }}"
                                       placeholder="0.00" required>
                            </div>
                            <div class="col-6">
                                <label for="stock" class="form-label fw-semibold">Stock</label>
                                <input type="number" min="0" class="form-control"
                                       id="stock" name="stock"
                                       value="{{ producto.stock if producto else '' }}"
                                       placeholder="0" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="bi bi-check-circle me-2"></i> {{ 'Guardar cambios' if producto else 'Guardar producto' }}
                            </button>
                            <a href="{{ url_for('producto_form.productos') }}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
