{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>{% if factura %}Editar{% else %}Nueva{% endif %} Factura</h1>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Número:</label>
            <input type="text" name="numero" class="form-control"
                   value="{{ factura.numero if factura else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Cliente:</label>
            <input type="text" name="cliente" class="form-control"
                   value="{{ factura.cliente if factura else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Fecha:</label>
            <input type="date" name="fecha" class="form-control"
                   value="{{ factura.fecha if factura else hoy }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Total:</label>
            <input type="number" step="0.01" name="total" class="form-control"
                   value="{{ factura.total if factura else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Estado:</label>
            <select name="estado" class="form-control">
                <option value="Pagada" {% if factura and factura.estado == 'Pagada' %}selected{% endif %}>Pagada</option>
                <option value="Pendiente" {% if factura and factura.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                <option value="Anulada" {% if factura and factura.estado == 'Anulada' %}selected{% endif %}>Anulada</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('factura_form.facturacion') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
