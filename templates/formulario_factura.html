{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="text-center mb-4">
        <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill mb-2">
            <i class="bi bi-{{ 'pencil' if factura else 'plus-circle' }} me-1"></i>
            {{ 'Editar registro' if factura else 'Nuevo registro' }}
        </span>
        <h2 class="fw-bold display-6">{{ 'Editar Factura' if factura else 'Ingresar Factura' }}</h2>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card info-card">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('factura_form.editar_factura', numero=factura.numero) if factura else url_for('factura_form.nueva_factura') }}">
                        <div class="mb-3">
                            <label for="numero" class="form-label fw-semibold">Número de factura</label>
                            <input type="text" class="form-control" id="numero" name="numero"
                                   value="{{ factura.numero if factura else '' }}"
                                   placeholder="Ej: F001-000127" required>
                        </div>

                        <div class="mb-3">
                            <label for="cliente" class="form-label fw-semibold">Cliente</label>
                            <input type="text" class="form-control" id="cliente" name="cliente"
                                   value="{{ factura.cliente if factura else '' }}"
                                   placeholder="Nombre del cliente" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="fecha" class="form-label fw-semibold">Fecha</label>
                                <input type="date" class="form-control" id="fecha" name="fecha"
                                       value="{{ hoy }}" required>
                            </div>
                            <div class="col-6">
                                <label for="total" class="form-label fw-semibold">Total ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       id="total" name="total"
                                       value="{{ factura.total if factura else '' }}"
                                       placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="estado" class="form-label fw-semibold">Estado</label>
                            <select class="form-select" id="estado" name="estado" required>
                                <option value="">Selecciona un estado...</option>
                                <option value="Pagada" {{ 'selected' if factura and factura.estado == 'Pagada' else '' }}>Pagada</option>
                                <option value="Pendiente" {{ 'selected' if factura and factura.estado == 'Pendiente' else '' }}>Pendiente</option>
                                <option value="Anulada" {{ 'selected' if factura and factura.estado == 'Anulada' else '' }}>Anulada</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="bi bi-check-circle me-2"></i> {{ 'Guardar cambios' if factura else 'Guardar factura' }}
                            </button>
                            <a href="{{ url_for('factura_form.facturacion') }}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
