{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>{% if cliente %}Editar{% else %}Nuevo{% endif %} Cliente</h1>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ cliente.nombre if cliente else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" name="email" class="form-control"
                   value="{{ cliente.email if cliente else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono:</label>
            <input type="text" name="telefono" class="form-control"
                   value="{{ cliente.telefono if cliente else '' }}">
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('cliente_form.clientes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
